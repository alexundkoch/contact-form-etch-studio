<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact form demo</title>
  <link rel="stylesheet" href="../etch/contact-form.css">
  <style>body { max-inline-size: 44rem; margin: 3rem auto; padding-inline: 1rem; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <h1>Contact form demo</h1>
  <form class="contact-form" id="contact-form" action="https://api.example.com" method="post" aria-label="Contact form" data-contact-form data-msg-sending="Sending your message …" data-msg-success="Thank you! Your message has been sent." data-msg-error="Something went wrong. Please try again later." data-msg-verify="Please complete the security check above the button.">
    <div class="contact-form__honeypot" hidden aria-hidden="true">
      <label class="contact-form__label" for="contact-form-website">Website</label>
      <input class="contact-form__input" id="contact-form-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <div class="contact-form__row">
      <div class="contact-form__field">
        <label class="contact-form__label" for="contact-form-name">Name *</label>
        <input class="contact-form__input" id="contact-form-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="contact-form__field">
        <label class="contact-form__label" for="contact-form-email">Email *</label>
        <input class="contact-form__input" id="contact-form-email" name="email" type="email" autocomplete="email" required>
      </div>
    </div>
    <div class="contact-form__row">
      <div class="contact-form__field">
        <label class="contact-form__label" for="contact-form-phone">Phone</label>
        <input class="contact-form__input" id="contact-form-phone" name="phone" type="tel" autocomplete="tel">
      </div>
      <div class="contact-form__field">
        <label class="contact-form__label" for="contact-form-subject">Subject *</label>
        <input class="contact-form__input" id="contact-form-subject" name="subject" type="text" required>
      </div>
    </div>
    <div class="contact-form__field">
      <label class="contact-form__label" for="contact-form-message">Message *</label>
      <textarea class="contact-form__input" id="contact-form-message" name="message" rows="5" required></textarea>
    </div>
    <label class="contact-form__consent"><input class="contact-form__checkbox" type="checkbox" name="consent" required><span class="contact-form__consent-text">I agree that my details will be stored to process my request. See the <a class="contact-form__link" href="/privacy">privacy policy</a>.</span></label>
    <div class="contact-form__turnstile" data-turnstile-sitekey=""></div>
    <div class="contact-form__actions">
      <button class="contact-form__submit" type="submit"><span class="contact-form__submit-text">Send message</span><span class="contact-form__spinner" aria-hidden="true"></span></button>
      <span class="contact-form__required">* Required</span>
    </div>
    <p class="contact-form__status" role="status" aria-live="polite" data-contact-status></p>
  </form>
  <script src="../etch/contact-form.js"></script>
</body>
</html>
